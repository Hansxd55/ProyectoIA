services:
  rio-claro:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      AZURE_FUNCTION_BASE_URL: ${AZURE_FUNCTION_BASE_URL:?Define AZURE_FUNCTION_BASE_URL}
      AZURE_FUNCTION_KEY: ${AZURE_FUNCTION_KEY:?Define AZURE_FUNCTION_KEY}
      APP_USERNAME: ${APP_USERNAME:?Define APP_USERNAME}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?Define APP_PASSWORD_HASH}
      INVOICE_API_BASE_URL: ${INVOICE_API_BASE_URL:?Define INVOICE_API_BASE_URL}
      INVOICE_API_USERNAME: ${INVOICE_API_USERNAME:?Define INVOICE_API_USERNAME}
      INVOICE_API_PASSWORD: ${INVOICE_API_PASSWORD:?Define INVOICE_API_PASSWORD}
    restart: unless-stopped
