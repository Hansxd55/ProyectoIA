services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - vendor:/app/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nexo
      DB_USERNAME: nexo
      DB_PASSWORD: nexo_secret
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "test -f .env || cp .env.example .env;
      grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force;
      php artisan migrate --seed --force;
      php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nexo
      MYSQL_USER: nexo
      MYSQL_PASSWORD: nexo_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  vendor:
